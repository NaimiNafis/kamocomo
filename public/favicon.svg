<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The duck from img/icons/kamo-collection.png, traced to a path so it stays
    sharp at 16px. The stroke is what makes it visible at that size: the
    drawing's own line is half a percent of its width, about a tenth of a pixel
    in a tab, so the outline is filled AND stroked to thicken it. evenodd keeps
    it hollow, since each pen line traces as an outer and an inner contour and
    even odd turns that pair back into a line.

    Tab strips are light in some browsers and dark in others, so the colour
    follows the viewer's theme: ink on light, stone on dark. Browsers that
    ignore the media query get the ink default, which is the commoner case.

    Careful with comments here: SVG is parsed as XML, so a double hyphen inside
    one makes the whole file invalid and the browser silently keeps whatever
    icon it had cached.
  -->
  <style>
    .duck { fill: #1C1C1A; stroke: #1C1C1A; }
    @media (prefers-color-scheme: dark) {
      .duck { fill: #E9E4D8; stroke: #E9E4D8; }
    }
  </style>
